spring:
  application:
    name: docpilot-worker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: docpilot-worker-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:mock-key}
    vectorstore:
      type: pgvector
      pgvector:
        table-name: vector_store
        schema-name: public
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: false
        schema-validation: true

docpilot:
  ai:
    mock: ${DOCPILOT_AI_MOCK:true}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:docpilot-documents}
  kafka:
    retry:
      max-attempts: 3
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 5000
  outbox:
    relay:
      enabled: true
      fixed-delay-ms: 1000
  delivery:
    email:
      from: ${DOCPILOT_EMAIL_FROM:notifications@docpilot.com}
      default-recipient: ${DOCPILOT_EMAIL_RECIPIENT:team@docpilot.com}
    x:
      bearer-token: ${X_BEARER_TOKEN:mock-token}
      api-url: ${X_API_URL:https://api.twitter.com/2/tweets}
  email-consumer:
    enabled: true
  social-consumer:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      emailDelivery:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 5000ms
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
      socialDelivery:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 5000ms
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      emailDelivery:
        timeout-duration: 3s
        cancel-running-future: true
      socialDelivery:
        timeout-duration: 3s
        cancel-running-future: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/docpilot
    username: docpilot
    password: docpilot_secret
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: localhost:9092

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/docpilot}
    username: ${SPRING_DATASOURCE_USERNAME:docpilot}
    password: ${SPRING_DATASOURCE_PASSWORD:docpilot_secret}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
  docpilot:
    storage:
      endpoint: ${DOCPILOT_STORAGE_ENDPOINT:http://minio:9000}
      access-key: ${DOCPILOT_STORAGE_ACCESS_KEY:minioadmin}
      secret-key: ${DOCPILOT_STORAGE_SECRET_KEY:minioadmin}
      bucket: ${DOCPILOT_STORAGE_BUCKET:docpilot-documents}
