spring:
  datasource:
    url: jdbc:h2:mem:workertestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    consumer:
      group-id: docpilot-worker-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  ai:
    openai:
      api-key: test-key
    vectorstore:
      type: simple

docpilot:
  ai:
    mock: true
  kafka:
    retry:
      max-attempts: 3
      initial-interval-ms: 100
      multiplier: 1.5
      max-interval-ms: 500
    lag-monitor:
      enabled: false
  outbox:
    relay:
      enabled: false
  delivery:
    email:
      from: notifications@docpilot.com
      default-recipient: team@docpilot.com
    x:
      bearer-token: test-token
      api-url: https://api.twitter.com/2/tweets
  email-consumer:
    enabled: true
  social-consumer:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      emailDelivery:
        sliding-window-size: 3
        minimum-number-of-calls: 3
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 2000ms
        permitted-number-of-calls-in-half-open-state: 1
      socialDelivery:
        sliding-window-size: 3
        minimum-number-of-calls: 3
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 2000ms
        permitted-number-of-calls-in-half-open-state: 1
  timelimiter:
    instances:
      emailDelivery:
        timeout-duration: 2s
        cancel-running-future: true
      socialDelivery:
        timeout-duration: 2s
        cancel-running-future: true
