apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: docpilot
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: docpilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.60.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: docpilot
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: docpilot
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - port: 16686
      targetPort: 16686
      name: ui
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: docpilot
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: docpilot
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: 'docpilot-api'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['docpilot-api.docpilot.svc.cluster.local:8080']
      - job_name: 'docpilot-worker'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['docpilot-worker.docpilot.svc.cluster.local:8081']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: docpilot
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: docpilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/name: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: docpilot
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: docpilot
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: http
