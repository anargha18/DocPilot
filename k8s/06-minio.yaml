apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: docpilot
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: docpilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        app.kubernetes.io/name: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          command:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: docpilot-secrets
                  key: DOCPILOT_STORAGE_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docpilot-secrets
                  key: DOCPILOT_STORAGE_SECRET_KEY
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: docpilot
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: docpilot
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
      name: api
    - port: 9001
      targetPort: 9001
      name: console
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: docpilot
  labels:
    app.kubernetes.io/name: minio-create-bucket
    app.kubernetes.io/part-of: docpilot
spec:
  template:
    metadata:
      labels:
        app: minio-create-bucket
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              until /usr/bin/mc alias set myminio http://minio.docpilot.svc.cluster.local:9000 minioadmin minioadmin; do
                echo "Waiting for MinIO...";
                sleep 2;
              done;
              /usr/bin/mc mb --ignore-existing myminio/docpilot-documents;
              echo "Bucket docpilot-documents ready.";
