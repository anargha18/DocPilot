spring:
  main:
    web-application-type: none
  ai:
    openai:
      api-key: test-key
    vectorstore:
      type: simple
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

docpilot:
  ai:
    mock: true
  kafka:
    lag-monitor:
      enabled: false

