spring:
  application:
    name: docpilot-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: docpilot-api-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:mock-key}
    vectorstore:
      type: pgvector
      pgvector:
        table-name: vector_store
        schema-name: public
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: false
        schema-validation: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
    ping:
      enabled: true
  info:
    env:
      enabled: true

docpilot:
  security:
    jwt:
      secret: ${DOCPILOT_JWT_SECRET:docpilot-secret-jwt-key-for-portfolio-authentication-must-be-at-least-256-bits-long-docpilot}
      expiration-ms: ${DOCPILOT_JWT_EXPIRATION_MS:86400000}
    users:
      - username: ${DOCPILOT_DEFAULT_USER_USERNAME:user}
        password: ${DOCPILOT_DEFAULT_USER_PASSWORD:password}
        roles:
          - USER
      - username: ${DOCPILOT_ADMIN_USERNAME:admin}
        password: ${DOCPILOT_ADMIN_PASSWORD:password}
        roles:
          - USER
          - ADMIN
  ai:
    mock: ${DOCPILOT_AI_MOCK:true}
  storage:
    bucket: docpilot-documents
  outbox:
    relay:
      enabled: true
      fixed-delay-ms: 1000
      initial-delay-ms: 1000
      batch-size: 50
